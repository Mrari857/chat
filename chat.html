<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 15px;
        }

        #messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
        }

        input, button {
            padding: 10px;
            margin: 3px;
        }

        #message {
            width: 60%;
        }

        .private {
            background: #fff3cd;
            padding: 5px;
            margin: 4px 0;
        }

        .public {
            padding: 5px;
            margin: 4px 0;
        }

        #voiceButton {
            font-size: 18px;
        }
    </style>
</head>

<body>

<h1>Chat</h1>

<div>
    <input id="username" placeholder="Your username">
    <button onclick="setUsername()">Set username</button>
</div>

<p id="status">Connecting...</p>

<div id="messages"></div>

<input id="message" placeholder="Message">

<button onclick="sendPublic()">Send</button>

<br>

<input id="privateTo" placeholder="Private reply to username">

<button onclick="sendPrivate()">Private</button>

<br>

<button id="voiceButton" onclick="toggleVoice()">
    🎙️ Voice
</button>

<span id="voiceStatus">Voice off</span>

<div id="audioContainer"></div>

<script>
const ws = new WebSocket(
    (location.protocol === "https:" ? "wss://" : "ws://")
    + location.host
);

let username = "Anonymous";

let localStream = null;
let voiceEnabled = false;

const peers = {};

const configuration = {
    iceServers: [
        {
            urls: "stun:stun.l.google.com:19302"
        }
    ]
};

const status = document.getElementById("status");
const messages = document.getElementById("messages");
const voiceButton = document.getElementById("voiceButton");
const voiceStatus = document.getElementById("voiceStatus");


// -------------------------
// WEBSOCKET
// -------------------------

ws.onopen = () => {
    status.textContent = "Connected";

    ws.send(JSON.stringify({
        type: "username",
        username: username
    }));
};

ws.onclose = () => {
    status.textContent = "Disconnected";
};

ws.onerror = () => {
    status.textContent = "Connection error";
};

ws.onmessage = async (event) => {

    const message = JSON.parse(event.data);

    // Text messages
    if (message.type === "public") {

        addMessage(
            `${message.from}: ${message.text}`,
            false
        );

        return;
    }

    if (message.type === "private") {

        addMessage(
            `🔒 ${message.from} → ${message.to}: ${message.text}`,
            true
        );

        return;
    }


    // WebRTC
    if (message.type === "voice-offer") {

        await receiveOffer(message);

        return;
    }

    if (message.type === "voice-answer") {

        const peer = peers[message.from];

        if (peer) {
            await peer.setRemoteDescription(
                new RTCSessionDescription(message.answer)
            );
        }

        return;
    }

    if (message.type === "voice-ice") {

        const peer = peers[message.from];

        if (peer && message.candidate) {

            try {
                await peer.addIceCandidate(
                    new RTCIceCandidate(message.candidate)
                );
            } catch {}
        }

        return;
    }
};


// -------------------------
// USERNAME
// -------------------------

function setUsername() {

    const input =
        document.getElementById("username");

    username =
        input.value.trim() || "Anonymous";

    if (ws.readyState === WebSocket.OPEN) {

        ws.send(JSON.stringify({
            type: "username",
            username: username
        }));
    }

    status.textContent =
        `Connected as ${username}`;
}


// -------------------------
// PUBLIC CHAT
// -------------------------

function sendPublic() {

    const input =
        document.getElementById("message");

    const text =
        input.value.trim();

    if (!text) return;

    ws.send(JSON.stringify({
        type: "public",
        text: text
    }));

    input.value = "";
}


// -------------------------
// PRIVATE CHAT
// -------------------------

function sendPrivate() {

    const input =
        document.getElementById("message");

    const target =
        document.getElementById("privateTo");

    const text =
        input.value.trim();

    const to =
        target.value.trim();

    if (!text || !to) return;

    ws.send(JSON.stringify({
        type: "private",
        to: to,
        text: text
    }));

    input.value = "";
}


// -------------------------
// DISPLAY MESSAGE
// -------------------------

function addMessage(text, isPrivate) {

    const div =
        document.createElement("div");

    div.textContent = text;

    div.className =
        isPrivate ? "private" : "public";

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;
}


// -------------------------
// VOICE
// -------------------------

async function toggleVoice() {

    if (!voiceEnabled) {

        await startVoice();

    } else {

        stopVoice();

    }
}


async function startVoice() {

    try {

        localStream =
            await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: false
            });

        voiceEnabled = true;

        voiceButton.textContent =
            "🔴 Stop Voice";

        voiceStatus.textContent =
            "Microphone ON";

        // Create connections for everyone currently connected.
        // The server relays the signaling messages.
        ws.send(JSON.stringify({
            type: "voice-offer",
            offer: null
        }));

    } catch (error) {

        console.error(error);

        alert(
            "Microphone permission was denied or unavailable."
        );
    }
}


function stopVoice() {

    voiceEnabled = false;

    if (localStream) {

        localStream
            .getTracks()
            .forEach(track => track.stop());

        localStream = null;
    }

    for (const name in peers) {

        try {
            peers[name].close();
        } catch {}

        delete peers[name];
    }

    voiceButton.textContent =
        "🎙️ Voice";

    voiceStatus.textContent =
        "Voice off";
}


// -------------------------
// RECEIVE VOICE OFFER
// -------------------------

async function receiveOffer(message) {

    if (!message.offer) {

        // The sender is announcing that voice is available.
        return;
    }

    if (!localStream) {

        localStream =
            await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: false
            });
    }

    const peer =
        createPeer(message.from);

    await peer.setRemoteDescription(
        new RTCSessionDescription(message.offer)
    );

    const answer =
        await peer.createAnswer();

    await peer.setLocalDescription(answer);

    ws.send(JSON.stringify({
        type: "voice-answer",
        answer: answer
    }));
}


// -------------------------
// CREATE PEER
// -------------------------

function createPeer(name) {

    if (peers[name]) {
        return peers[name];
    }

    const peer =
        new RTCPeerConnection(configuration);

    peers[name] = peer;


    // Add microphone
    if (localStream) {

        localStream
            .getTracks()
            .forEach(track => {
                peer.addTrack(
                    track,
                    localStream
                );
            });
    }


    // Receive audio
    peer.ontrack = (event) => {

        let audio =
            document.getElementById(
                "audio-" + name
            );

        if (!audio) {

            audio =
                document.createElement("audio");

            audio.id =
                "audio-" + name;

            audio.autoplay = true;

            audio.controls = true;

            document
                .getElementById("audioContainer")
                .appendChild(audio);
        }

        audio.srcObject =
            event.streams[0];
    };


    // ICE candidates
    peer.onicecandidate = (event) => {

        if (event.candidate) {

            ws.send(JSON.stringify({
                type: "voice-ice",
                candidate: event.candidate
            }));
        }
    };


    return peer;
}
</script>

</body>
</html>
