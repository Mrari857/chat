<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 800px;
    margin: 30px auto;
    padding: 15px;
}

#messages {
    height: 400px;
    overflow-y: auto;
    border: 1px solid #ccc;
    padding: 10px;
    margin-bottom: 10px;
}

.message {
    padding: 8px;
    margin: 5px 0;
    border-radius: 6px;
    background: #f1f1f1;
}

.private {
    background: #fff3cd;
}

.message button {
    padding: 4px 8px;
    margin-left: 8px;
    font-size: 12px;
}

input,
button {
    padding: 10px;
    margin: 3px;
}

#message {
    width: 60%;
}

#privateMode {
    display: none;
    padding: 8px;
    margin-bottom: 8px;
    background: #fff3cd;
    border-radius: 5px;
}

#voiceButton {
    font-size: 16px;
}

#voiceStatus {
    margin-left: 8px;
}
</style>
</head>

<body>

<h1>Chat</h1>

<div>
    <input id="username" placeholder="Your username">
    <button onclick="setUsername()">Set username</button>
</div>

<p id="status">Connecting...</p>

<div id="messages"></div>

<div id="privateMode">
    🔒 Private message to <strong id="privateTarget"></strong>
    <button onclick="cancelPrivate()">Public</button>
</div>

<div>
    <input
        id="message"
        placeholder="Message..."
        onkeydown="handleEnter(event)"
    >

    <button onclick="sendMessage()">Send</button>
</div>

<br>

<button id="voiceButton" onclick="toggleVoice()">
    🎙️ Join Voice
</button>

<span id="voiceStatus">Voice off</span>

<div id="audioContainer"></div>


<script>

const ws = new WebSocket(
    (location.protocol === "https:" ? "wss://" : "ws://")
    + location.host
);

let myId = null;
let username = "Anonymous";

let privateTarget = null;

let localStream = null;
let voiceEnabled = false;

const peers = {};
const knownUsers = new Set();

const configuration = {
    iceServers: [
        {
            urls: "stun:stun.l.google.com:19302"
        }
    ]
};

const status =
    document.getElementById("status");

const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("message");

const privateMode =
    document.getElementById("privateMode");

const privateTargetText =
    document.getElementById("privateTarget");

const voiceButton =
    document.getElementById("voiceButton");

const voiceStatus =
    document.getElementById("voiceStatus");


// ============================
// CONNECTION
// ============================

ws.onopen = () => {

    status.textContent = "Connected";

    ws.send(JSON.stringify({
        type: "username",
        username: username
    }));
};


ws.onclose = () => {

    status.textContent = "Disconnected";
};


ws.onerror = () => {

    status.textContent = "Connection error";
};


// ============================
// RECEIVE
// ============================

ws.onmessage = async (event) => {

    const data = JSON.parse(event.data);


    // Our ID
    if (data.type === "your-id") {

        myId = data.id;

        return;
    }


    // User joined / username
    if (data.type === "user") {

        knownUsers.add(data.id);

        if (
            voiceEnabled &&
            data.id !== myId
        ) {
            await createOffer(data.id);
        }

        return;
    }


    // Public message
    if (data.type === "public") {

        addMessage(
            data.from,
            data.text,
            false
        );

        return;
    }


    // Private message
    if (data.type === "private") {

        addMessage(
            data.from,
            data.text,
            true,
            data.to
        );

        return;
    }


    // User left
    if (data.type === "user-left") {

        removePeer(data.id);

        return;
    }


    // WebRTC offer
    if (data.type === "voice-offer") {

        await receiveOffer(data);

        return;
    }


    // WebRTC answer
    if (data.type === "voice-answer") {

        const peer = peers[data.from];

        if (peer) {

            await peer.setRemoteDescription(
                new RTCSessionDescription(
                    data.answer
                )
            );
        }

        return;
    }


    // ICE
    if (data.type === "voice-ice") {

        const peer = peers[data.from];

        if (
            peer &&
            data.candidate
        ) {

            try {

                await peer.addIceCandidate(
                    new RTCIceCandidate(
                        data.candidate
                    )
                );

            } catch (error) {

                console.log(
                    "ICE error:",
                    error
                );
            }
        }

        return;
    }
};


// ============================
// USERNAME
// ============================

function setUsername() {

    const input =
        document.getElementById("username");

    const name =
        input.value.trim();

    if (name) {
        username = name;
    }

    ws.send(JSON.stringify({
        type: "username",
        username: username
    }));

    status.textContent =
        `Connected as ${username}`;
}


// ============================
// SEND MESSAGE
// ============================

function sendMessage() {

    const text =
        messageInput.value.trim();

    if (!text) return;


    // Private
    if (privateTarget) {

        ws.send(JSON.stringify({

            type: "private",

            to: privateTarget,

            text: text
        }));

    }

    // Public
    else {

        ws.send(JSON.stringify({

            type: "public",

            text: text
        }));
    }


    messageInput.value = "";
}


// ============================
// ENTER SENDS MESSAGE
// ============================

function handleEnter(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();
    }
}


// ============================
// REPLY PRIVATELY
// ============================

function replyTo(name) {

    if (name === username) {
        return;
    }

    privateTarget = name;

    privateTargetText.textContent =
        name;

    privateMode.style.display =
        "block";

    messageInput.placeholder =
        `Private message to ${name}...`;

    messageInput.focus();
}


// ============================
// RETURN TO PUBLIC
// ============================

function cancelPrivate() {

    privateTarget = null;

    privateMode.style.display =
        "none";

    messageInput.placeholder =
        "Message...";

    messageInput.focus();
}


// ============================
// DISPLAY MESSAGE
// ============================

function addMessage(
    from,
    text,
    isPrivate,
    to = null
) {

    const div =
        document.createElement("div");

    div.className =
        "message" +
        (isPrivate ? " private" : "");


    const textSpan =
        document.createElement("span");

    if (isPrivate) {

        textSpan.textContent =
            `🔒 ${from} → ${to}: ${text}`;

    } else {

        textSpan.textContent =
            `${from}: ${text}`;
    }


    const replyButton =
        document.createElement("button");

    replyButton.textContent =
        "Reply";

    replyButton.onclick = () => {

        replyTo(from);
    };


    div.appendChild(textSpan);

    div.appendChild(replyButton);

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;
}


// ============================
// VOICE
// ============================

async function toggleVoice() {

    if (voiceEnabled) {

        stopVoice();

    } else {

        await startVoice();
    }
}


async function startVoice() {

    try {

        localStream =
            await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: false
            });

        voiceEnabled = true;

        voiceButton.textContent =
            "🔴 Leave Voice";

        voiceStatus.textContent =
            "Microphone ON";


        for (const id of knownUsers) {

            if (id !== myId) {

                await createOffer(id);
            }
        }

    } catch (error) {

        console.error(error);

        alert(
            "Microphone permission was denied or unavailable."
        );
    }
}


// ============================
// STOP VOICE
// ============================

function stopVoice() {

    voiceEnabled = false;

    if (localStream) {

        localStream
            .getTracks()
            .forEach(track => track.stop());

        localStream = null;
    }


    for (const id in peers) {

        try {
            peers[id].close();
        } catch {}

        delete peers[id];
    }


    document
        .querySelectorAll("#audioContainer audio")
        .forEach(audio => {

            audio.srcObject = null;
            audio.remove();
        });


    voiceButton.textContent =
        "🎙️ Join Voice";

    voiceStatus.textContent =
        "Voice off";
}


// ============================
// CREATE OFFER
// ============================

async function createOffer(targetId) {

    if (!localStream) return;

    if (targetId === myId) return;


    const peer =
        createPeer(targetId);


    const offer =
        await peer.createOffer();


    await peer.setLocalDescription(
        offer
    );


    ws.send(JSON.stringify({

        type: "voice-offer",

        to: targetId,

        offer: offer
    }));
}


// ============================
// RECEIVE OFFER
// ============================

async function receiveOffer(data) {

    if (!localStream) {

        try {

            localStream =
                await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: false
                });

        } catch {

            return;
        }
    }


    const peer =
        createPeer(data.from);


    await peer.setRemoteDescription(
        new RTCSessionDescription(
            data.offer
        )
    );


    const answer =
        await peer.createAnswer();


    await peer.setLocalDescription(
        answer
    );


    ws.send(JSON.stringify({

        type: "voice-answer",

        to: data.from,

        answer: answer
    }));
}


// ============================
// CREATE PEER
// ============================

function createPeer(id) {

    if (peers[id]) {
        return peers[id];
    }


    const peer =
        new RTCPeerConnection(
            configuration
        );

    peers[id] = peer;


    if (localStream) {

        localStream
            .getTracks()
            .forEach(track => {

                peer.addTrack(
                    track,
                    localStream
                );
            });
    }


    peer.ontrack = (event) => {

        let audio =
            document.getElementById(
                "audio-" + id
            );


        if (!audio) {

            audio =
                document.createElement("audio");

            audio.id =
                "audio-" + id;

            audio.autoplay = true;

            audio.controls = true;

            document
                .getElementById(
                    "audioContainer"
                )
                .appendChild(audio);
        }


        audio.srcObject =
            event.streams[0];
    };


    peer.onicecandidate =
        (event) => {

            if (event.candidate) {

                ws.send(JSON.stringify({

                    type: "voice-ice",

                    to: id,

                    candidate:
                        event.candidate
                }));
            }
        };


    return peer;
}


// ============================
// REMOVE PEER
// ============================

function removePeer(id) {

    if (peers[id]) {

        try {
            peers[id].close();
        } catch {}

        delete peers[id];
    }


    const audio =
        document.getElementById(
            "audio-" + id
        );

    if (audio) {
        audio.remove();
    }

    knownUsers.delete(id);
}

</script>

</body>
</html>
