<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat</title>
<style>
body{font-family:Arial;max-width:800px;margin:20px auto;padding:15px}
#messages{height:400px;overflow:auto;border:1px solid #ccc;padding:10px}
.msg{padding:7px;margin:5px 0;background:#f1f1f1;border-radius:6px}
.private{background:#fff3cd}
.msg button{margin-left:8px}
input,button{padding:9px}
#message{width:60%}
#privateBar{display:none;background:#fff3cd;padding:8px;margin:5px 0}
</style>
</head>
<body>

<h1>Chat</h1>

<input id="username" placeholder="Username">
<button onclick="setUsername()">Set</button>

<p id="status">Connecting...</p>

<div id="messages"></div>

<div id="privateBar">
🔒 Private to <b id="privateName"></b>
<button onclick="makePublic()">Public</button>
</div>

<input id="message" placeholder="Message..." onkeydown="enterSend(event)">
<button onclick="sendMessage()">Send</button>

<br><br>

<button id="voice" onclick="toggleVoice()">🎙️ Join Voice</button>
<span id="voiceStatus">Voice off</span>

<div id="audio"></div>

<script>
const ws=new WebSocket(
(location.protocol==="https:"?"wss://":"ws://")+location.host
);

let myId=null;
let username="Anonymous";
let privateTo=null;
let stream=null;
let voiceOn=false;

const users=new Map();
const peers=new Map();
const iceQueue=new Map();

const rtcConfig={
iceServers:[{urls:"stun:stun.l.google.com:19302"}]
};

const status=document.getElementById("status");
const messages=document.getElementById("messages");
const message=document.getElementById("message");
const voiceButton=document.getElementById("voice");
const voiceStatus=document.getElementById("voiceStatus");

ws.onopen=()=>{
status.textContent="Connected";
sendUsername();
};

ws.onclose=()=>{
status.textContent="Disconnected";
};

ws.onmessage=async e=>{
const d=JSON.parse(e.data);

if(d.type==="your-id"){
myId=d.id;
return;
}

if(d.type==="user-list"){
users.clear();
d.users.forEach(u=>users.set(u.id,u));
return;
}

if(d.type==="public"){
showMessage(d.from,d.text,false);
return;
}

if(d.type==="private"){
showMessage(d.from,d.text,true,d.to);
return;
}

if(d.type==="user-left"){
removePeer(d.id);
return;
}

if(d.type==="voice-offer"){
await receiveOffer(d);
return;
}

if(d.type==="voice-answer"){
const p=peers.get(d.from);
if(!p)return;
await p.setRemoteDescription(d.answer);
await flushIce(d.from);
return;
}

if(d.type==="voice-ice"){
const p=peers.get(d.from);

if(!p||!p.remoteDescription){
if(!iceQueue.has(d.from))iceQueue.set(d.from,[]);
iceQueue.get(d.from).push(d.candidate);
}else{
try{await p.addIceCandidate(d.candidate)}catch(e){}
}
}
};

function sendUsername(){
ws.send(JSON.stringify({
type:"username",
username
}));
}

function setUsername(){
const n=document.getElementById("username").value.trim();
if(n)username=n;
sendUsername();
status.textContent="Connected as "+username;
}

function sendMessage(){
const text=message.value.trim();
if(!text)return;

ws.send(JSON.stringify(
privateTo
?{type:"private",to:privateTo,text}
:{type:"public",text}
));

message.value="";
}

function enterSend(e){
if(e.key==="Enter"){
e.preventDefault();
sendMessage();
}
}

function showMessage(from,text,isPrivate,to){
const div=document.createElement("div");
div.className="msg"+(isPrivate?" private":"");

const span=document.createElement("span");
span.textContent=isPrivate
?`🔒 ${from} → ${to}: ${text}`
:`${from}: ${text}`;

const button=document.createElement("button");
button.textContent="Reply";

button.onclick=()=>{
privateTo=from;
document.getElementById("privateName").textContent=from;
document.getElementById("privateBar").style.display="block";
message.placeholder="Private message...";
message.focus();
};

div.append(span,button);
messages.appendChild(div);
messages.scrollTop=messages.scrollHeight;
}

function makePublic(){
privateTo=null;
document.getElementById("privateBar").style.display="none";
message.placeholder="Message...";
message.focus();
}

async function toggleVoice(){
if(voiceOn){
stopVoice();
}else{
await startVoice();
}
}

async function startVoice(){
try{
stream=await navigator.mediaDevices.getUserMedia({audio:true});

voiceOn=true;
voiceButton.textContent="🔴 Leave Voice";
voiceStatus.textContent="Microphone ON";

for(const [id] of users){
if(id!==myId && myId<id){
await makeOffer(id);
}
}
}catch(e){
alert("Could not access microphone.");
}
}

function createPeer(id){
if(peers.has(id))return peers.get(id);

const p=new RTCPeerConnection(rtcConfig);
peers.set(id,p);

if(stream){
stream.getTracks().forEach(t=>p.addTrack(t,stream));
}

p.ontrack=e=>{
let audio=document.getElementById("audio-"+id);

if(!audio){
audio=document.createElement("audio");
audio.id="audio-"+id;
audio.autoplay=true;
audio.playsInline=true;
document.getElementById("audio").appendChild(audio);
}

audio.srcObject=e.streams[0];
audio.play().catch(()=>{});
};

p.onicecandidate=e=>{
if(e.candidate){
ws.send(JSON.stringify({
type:"voice-ice",
to:id,
candidate:e.candidate
}));
}
};

return p;
}

async function makeOffer(id){
const p=createPeer(id);

const offer=await p.createOffer();
await p.setLocalDescription(offer);

ws.send(JSON.stringify({
type:"voice-offer",
to:id,
offer:p.localDescription
}));
}

async function receiveOffer(d){
if(!stream){
try{
stream=await navigator.mediaDevices.getUserMedia({audio:true});
voiceOn=true;
voiceButton.textContent="🔴 Leave Voice";
voiceStatus.textContent="Microphone ON";
}catch(e){
return;
}
}

const p=createPeer(d.from);

await p.setRemoteDescription(d.offer);
await flushIce(d.from);

const answer=await p.createAnswer();
await p.setLocalDescription(answer);

ws.send(JSON.stringify({
type:"voice-answer",
to:d.from,
answer:p.localDescription
}));
}

async function flushIce(id){
const p=peers.get(id);
const q=iceQueue.get(id);

if(!p||!q)return;

for(const c of q){
try{await p.addIceCandidate(c)}catch(e){}
}

iceQueue.delete(id);
}

function removePeer(id){
const p=peers.get(id);
if(p)p.close();

peers.delete(id);
iceQueue.delete(id);

const a=document.getElementById("audio-"+id);
if(a)a.remove();
}

function stopVoice(){
voiceOn=false;

if(stream){
stream.getTracks().forEach(t=>t.stop());
stream=null;
}

for(const p of peers.values())p.close();

peers.clear();
iceQueue.clear();

document.querySelectorAll("#audio audio").forEach(a=>a.remove());

voiceButton.textContent="🎙️ Join Voice";
voiceStatus.textContent="Voice off";
}
</script>

</body>
</html>
