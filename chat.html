<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 800px;
    margin: 20px auto;
    padding: 15px;
}

#messages {
    height: 400px;
    overflow-y: auto;
    border: 1px solid #ccc;
    padding: 10px;
    margin: 10px 0;
}

.msg {
    padding: 7px;
    margin: 5px 0;
    background: #f1f1f1;
    border-radius: 6px;
}

.private {
    background: #fff3cd;
}

.msg button {
    margin-left: 8px;
    padding: 3px 7px;
}

input, button {
    padding: 9px;
}

#message {
    width: 60%;
}

#privateBar {
    display: none;
    background: #fff3cd;
    padding: 8px;
    margin-bottom: 5px;
}
</style>
</head>

<body>

<h1>Chat</h1>

<input id="username" placeholder="Username">
<button onclick="setUsername()">Set</button>

<p id="status">Connecting...</p>

<div id="messages"></div>

<div id="privateBar">
    🔒 Private to <b id="privateName"></b>
    <button onclick="makePublic()">Public</button>
</div>

<input id="message" placeholder="Message..." onkeydown="enterSend(event)">
<button onclick="sendMessage()">Send</button>

<br><br>

<button id="voice" onclick="toggleVoice()">🎙️ Join Voice</button>
<span id="voiceStatus">Voice off</span>

<div id="audio"></div>

<script>

const ws = new WebSocket(
    (location.protocol === "https:" ? "wss://" : "ws://") +
    location.host
);

let myId = null;
let username = "Anonymous";
let privateTo = null;

let voiceOn = false;
let stream = null;

const peers = new Map();
const pendingIce = new Map();
const users = new Map();

const rtcConfig = {
    iceServers: [
        { urls: "stun:stun.l.google.com:19302" }
    ]
};

const status = document.getElementById("status");
const messages = document.getElementById("messages");
const message = document.getElementById("message");
const privateBar = document.getElementById("privateBar");
const privateName = document.getElementById("privateName");
const voiceButton = document.getElementById("voice");
const voiceStatus = document.getElementById("voiceStatus");


// ============================
// CONNECTION
// ============================

ws.onopen = () => {
    status.textContent = "Connected";
    sendUsername();
};

ws.onclose = () => {
    status.textContent = "Disconnected";
};

ws.onmessage = async (event) => {

    const data = JSON.parse(event.data);

    if (data.type === "your-id") {
        myId = data.id;
        return;
    }

    if (data.type === "user-list") {
        users.clear();

        for (const user of data.users) {
            users.set(user.id, user);
        }

        return;
    }

    if (data.type === "public") {
        showMessage(data.from, data.text, false);
        return;
    }

    if (data.type === "private") {
        showMessage(data.from, data.text, true, data.to);
        return;
    }

    if (data.type === "user-left") {
        removePeer(data.id);
        return;
    }

    if (data.type === "voice-offer") {
        await answerVoice(data);
        return;
    }

    if (data.type === "voice-answer") {

        const peer = peers.get(data.from);

        if (!peer) return;

        try {
            await peer.setRemoteDescription(data.answer);
            await flushIce(data.from);
        } catch (e) {
            console.error("Answer error:", e);
        }

        return;
    }

    if (data.type === "voice-ice") {

        if (!data.candidate) return;

        const peer = peers.get(data.from);

        if (!peer || !peer.remoteDescription) {

            if (!pendingIce.has(data.from)) {
                pendingIce.set(data.from, []);
            }

            pendingIce.get(data.from).push(data.candidate);
            return;
        }

        try {
            await peer.addIceCandidate(data.candidate);
        } catch (e) {
            console.error("ICE error:", e);
        }
    }
};


// ============================
// USERNAME
// ============================

function sendUsername() {

    ws.send(JSON.stringify({
        type: "username",
        username
    }));
}

function setUsername() {

    const input = document.getElementById("username");
    const name = input.value.trim();

    if (name) {
        username = name;
    }

    sendUsername();

    status.textContent =
        "Connected as " + username;
}


// ============================
// CHAT
// ============================

function sendMessage() {

    const text = message.value.trim();

    if (!text) return;

    if (privateTo) {

        ws.send(JSON.stringify({
            type: "private",
            to: privateTo,
            text
        }));

    } else {

        ws.send(JSON.stringify({
            type: "public",
            text
        }));
    }

    message.value = "";
}

function enterSend(event) {

    if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
    }
}


// ============================
// DISPLAY
// ============================

function showMessage(from, text, isPrivate, to) {

    const div = document.createElement("div");

    div.className =
        "msg" + (isPrivate ? " private" : "");

    const textSpan = document.createElement("span");

    textSpan.textContent = isPrivate
        ? `🔒 ${from} → ${to}: ${text}`
        : `${from}: ${text}`;

    const reply = document.createElement("button");

    reply.textContent = "Reply";

    reply.onclick = () => {

        privateTo = from;

        privateName.textContent = from;
        privateBar.style.display = "block";
        message.placeholder = "Private message...";
        message.focus();
    };

    div.appendChild(textSpan);
    div.appendChild(reply);

    messages.appendChild(div);

    messages.scrollTop = messages.scrollHeight;
}


// ============================
// PUBLIC MODE
// ============================

function makePublic() {

    privateTo = null;

    privateBar.style.display = "none";
    message.placeholder = "Message...";
    message.focus();
}


// ============================
// VOICE
// ============================

async function toggleVoice() {

    if (voiceOn) {
        stopVoice();
    } else {
        await startVoice();
    }
}

async function startVoice() {

    try {

        stream = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            }
        });

        voiceOn = true;

        voiceButton.textContent = "🔴 Leave Voice";
        voiceStatus.textContent = "Microphone ON";

        for (const [id] of users) {

            if (id !== myId) {
                await makeOffer(id);
            }
        }

    } catch (error) {

        console.error(error);

        alert("Could not access the microphone.");
    }
}


// ============================
// OFFER
// ============================

async function makeOffer(id) {

    if (!stream) return;

    const peer = makePeer(id);

    try {

        const offer = await peer.createOffer();

        await peer.setLocalDescription(offer);

        ws.send(JSON.stringify({
            type: "voice-offer",
            to: id,
            offer: peer.localDescription
        }));

    } catch (e) {

        console.error("Offer error:", e);
    }
}


// ============================
// ANSWER
// ============================

async function answerVoice(data) {

    if (!stream) {

        try {

            stream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            });

            voiceOn = true;

            voiceButton.textContent = "🔴 Leave Voice";
            voiceStatus.textContent = "Microphone ON";

        } catch (e) {

            console.error("Microphone error:", e);
            return;
        }
    }

    const peer = makePeer(data.from);

    try {

        await peer.setRemoteDescription(data.offer);

        await flushIce(data.from);

        const answer = await peer.createAnswer();

        await peer.setLocalDescription(answer);

        ws.send(JSON.stringify({
            type: "voice-answer",
            to: data.from,
            answer: peer.localDescription
        }));

    } catch (e) {

        console.error("Answer error:", e);
    }
}


// ============================
// PEER
// ============================

function makePeer(id) {

    if (peers.has(id)) {
        return peers.get(id);
    }

    const peer = new RTCPeerConnection(rtcConfig);

    peers.set(id, peer);

    if (stream) {

        for (const track of stream.getTracks()) {
            peer.addTrack(track, stream);
        }
    }

    peer.ontrack = async (event) => {

        let audio = document.getElementById("audio-" + id);

        if (!audio) {

            audio = document.createElement("audio");

            audio.id = "audio-" + id;
            audio.autoplay = true;
            audio.playsInline = true;
            audio.controls = false;

            document.getElementById("audio").appendChild(audio);
        }

        if (event.streams && event.streams[0]) {
            audio.srcObject = event.streams[0];
        } else {

            const remoteStream = new MediaStream();
            remoteStream.addTrack(event.track);
            audio.srcObject = remoteStream;
        }

        try {
            await audio.play();
        } catch (e) {
            console.log("Audio autoplay waiting:", e);
        }
    };

    peer.onicecandidate = (event) => {

        if (event.candidate) {

            ws.send(JSON.stringify({
                type: "voice-ice",
                to: id,
                candidate: event.candidate
            }));
        }
    };

    peer.onconnectionstatechange = () => {

        console.log(
            "Voice connection",
            id,
            peer.connectionState
        );

        if (
            peer.connectionState === "failed" ||
            peer.connectionState === "closed"
        ) {
            removePeer(id);
        }
    };

    return peer;
}


// ============================
// ICE QUEUE
// ============================

async function flushIce(id) {

    const peer = peers.get(id);
    const candidates = pendingIce.get(id);

    if (!peer || !candidates) return;

    for (const candidate of candidates) {

        try {
            await peer.addIceCandidate(candidate);
        } catch (e) {
            console.error("Queued ICE error:", e);
        }
    }

    pendingIce.delete(id);
}


// ============================
// REMOVE PEER
// ============================

function removePeer(id) {

    const peer = peers.get(id);

    if (peer) {
        peer.close();
        peers.delete(id);
    }

    pendingIce.delete(id);

    const audio = document.getElementById("audio-" + id);

    if (audio) {
        audio.srcObject = null;
        audio.remove();
    }
}


// ============================
// STOP VOICE
// ============================

function stopVoice() {

    voiceOn = false;

    if (stream) {

        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    for (const peer of peers.values()) {
        peer.close();
    }

    peers.clear();
    pendingIce.clear();

    document
        .querySelectorAll("#audio audio")
        .forEach(a => {
            a.srcObject = null;
            a.remove();
        });

    voiceButton.textContent = "🎙️ Join Voice";
    voiceStatus.textContent = "Voice off";
}

</script>

</body>
</html>
