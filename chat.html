<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatShine</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#0b0d12;
    --panel:#12151d;
    --panel2:#181c26;
    --border:#272c38;
    --text:#f4f6fb;
    --muted:#8d95a7;
    --accent:#7c5cff;
    --accent2:#6245e8;
    --green:#35d07f;
    --red:#ff5364;
    --yellow:#ffd166;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at top left,#211a46 0,transparent 35%),
        var(--bg);
    color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,
        BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input{font:inherit}
button{cursor:pointer}

.app{
    min-height:100vh;
    display:grid;
    grid-template-columns:250px 1fr 280px;
}

/* SIDEBAR */

.sidebar{
    background:rgba(12,14,20,.94);
    border-right:1px solid var(--border);
    padding:20px;
}

.logo{
    font-size:22px;
    font-weight:800;
    margin-bottom:28px;
}

.logo span{color:var(--accent)}

.section-title{
    color:var(--muted);
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.12em;
    margin:18px 5px 8px;
}

.channel{
    padding:11px 12px;
    border-radius:9px;
    color:var(--muted);
    margin-bottom:4px;
}

.channel.active{
    color:white;
    background:rgba(124,92,255,.17);
}

/* MAIN */

.main{
    display:flex;
    flex-direction:column;
    min-width:0;
}

.topbar{
    height:68px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:rgba(12,14,20,.65);
    backdrop-filter:blur(15px);
}

.room-title{font-weight:800}

.messages{
    flex:1;
    overflow-y:auto;
    padding:22px;
}

.welcome{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
}

.welcome h2{color:white}

/* MESSAGES */

.msg{
    display:flex;
    gap:12px;
    margin-bottom:18px;
}

.avatar{
    width:38px;
    height:38px;
    flex:0 0 38px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,var(--accent),#a78bfa);
    font-weight:800;
}

.msg-body{min-width:0}

.msg-head{
    display:flex;
    align-items:baseline;
    gap:8px;
}

.msg-name{font-weight:800}

.msg-time{
    color:var(--muted);
    font-size:11px;
}

.msg-text{
    margin-top:3px;
    color:#d8dce6;
    word-break:break-word;
}

.msg.private .msg-text{color:#ffe39b}

.reply{
    opacity:0;
    margin-left:8px;
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:12px;
}

.msg:hover .reply{opacity:1}

/* COMPOSER */

.composer-wrap{
    padding:15px 20px 20px;
}

.private-bar{
    display:none;
    padding:9px 12px;
    margin-bottom:8px;
    background:rgba(255,209,102,.1);
    border:1px solid rgba(255,209,102,.25);
    border-radius:9px;
    color:var(--yellow);
}

.private-bar button{
    margin-left:8px;
    border:0;
    border-radius:7px;
    padding:5px 9px;
    background:var(--panel2);
    color:white;
}

.composer{
    display:flex;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:13px;
    padding:7px;
}

.composer input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    padding:10px;
}

.send{
    border:0;
    border-radius:9px;
    padding:0 18px;
    color:white;
    background:var(--accent);
    font-weight:700;
}

.send:hover{background:var(--accent2)}

/* PEOPLE */

.people{
    border-left:1px solid var(--border);
    background:rgba(12,14,20,.7);
    padding:20px;
    overflow-y:auto;
}

.people h3{margin-top:0}

.user{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    border-radius:10px;
    margin-bottom:5px;
}

.user:hover{background:var(--panel2)}

.user-avatar{
    width:34px;
    height:34px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:#272d3a;
    font-size:13px;
    font-weight:800;
}

.user-info{
    flex:1;
    min-width:0;
}

.user-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.user-state{
    color:var(--green);
    font-size:11px;
}

/* LOGIN */

.login{
    position:fixed;
    inset:0;
    z-index:100;
    display:grid;
    place-items:center;
    background:rgba(5,6,10,.88);
    backdrop-filter:blur(12px);
}

.login-card{
    width:min(420px,calc(100% - 30px));
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:30px;
    box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.login-card h1{margin-top:0}

.login-card p{color:var(--muted)}

.login-card input{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid var(--border);
    outline:none;
    background:var(--panel2);
    color:white;
    margin:12px 0;
}

.login-card button{
    width:100%;
    border:0;
    padding:13px;
    border-radius:10px;
    background:var(--accent);
    color:white;
    font-weight:800;
}

/* VOICE */

.voice-panel{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    display:none;
    align-items:center;
    gap:12px;
    padding:12px 15px;
    background:rgba(18,21,29,.96);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:0 15px 50px rgba(0,0,0,.45);
    z-index:50;
}

.voice-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--green);
}

.voice-name{font-weight:700}

.voice-status{
    color:var(--muted);
    font-size:12px;
}

.voice-buttons{
    display:flex;
    gap:6px;
}

.voice-buttons button{
    border:0;
    border-radius:9px;
    padding:9px 12px;
    background:var(--panel2);
    color:white;
}

.voice-buttons .hangup{
    background:var(--red);
}

.voice-join{
    margin-top:20px;
    width:100%;
    border:0;
    border-radius:10px;
    padding:11px;
    background:var(--accent);
    color:white;
    font-weight:800;
}

/* MOBILE */

@media(max-width:900px){
    .app{
        grid-template-columns:1fr;
    }

    .sidebar,.people{
        display:none;
    }

    .messages{
        padding:15px;
    }

    .topbar{
        padding:0 15px;
    }

    .voice-panel{
        left:15px;
        right:15px;
        bottom:15px;
        transform:none;
        justify-content:space-between;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div class="login" id="login">
    <div class="login-card">
        <h1>✨ Welcome to ChatShine</h1>

        <p>
            Pick a username and jump into the conversation.
        </p>

        <input
            id="username"
            maxlength="30"
            placeholder="Username"
            autocomplete="off"
        >

        <button onclick="setUsername()">
            Enter Chat
        </button>
    </div>
</div>

<div class="app">

<!-- LEFT -->

<aside class="sidebar">

    <div class="logo">
        Chat<span>Shine</span>
    </div>

    <div class="section-title">
        Channels
    </div>

    <div class="channel active">
        💬 General
    </div>

    <div class="channel">
        🎙️ Voice
    </div>

</aside>

<!-- CENTER -->

<main class="main">

    <header class="topbar">

        <div class="room-title">
            💬 General
        </div>

    </header>

    <section
        class="messages"
        id="messages"
    >

        <div class="welcome" id="welcome">

            <h2>
                Welcome to General 👋
            </h2>

            <p>
                Send a message or select someone
                to start a private conversation.
            </p>

        </div>

    </section>

    <!-- COMPOSER -->

    <div class="composer-wrap">

        <div
            class="private-bar"
            id="privateBar"
        >

            🔒 Private message to
            <b id="privateName"></b>

            <button onclick="makePublic()">
                Public
            </button>

        </div>

        <div class="composer">

            <input
                id="message"
                type="text"
                placeholder="Message #general"
                autocomplete="off"
                onkeydown="enterSend(event)"
            >

            <button
                class="send"
                onclick="sendMessage()"
            >
                Send
            </button>

        </div>

    </div>

</main>

<!-- RIGHT -->

<aside class="people">

    <h3>Online</h3>

    <div id="users"></div>

    <button
        class="voice-join"
        id="joinVoice"
        onclick="toggleVoice()"
    >
        🎙️ Join Voice
    </button>

</aside>

</div>

<!-- VOICE PANEL -->

<div
    class="voice-panel"
    id="voicePanel"
>

    <div class="voice-dot"></div>

    <div>

        <div
            class="voice-name"
            id="voiceName"
        >
            Voice Room
        </div>

        <div
            class="voice-status"
            id="voiceStatus"
        >
            Connected
        </div>

    </div>

    <div class="voice-buttons">

        <button
            onclick="toggleMute()"
            id="muteButton"
        >
            🔇 Mute
        </button>

        <button
            class="hangup"
            onclick="leaveVoice()"
        >
            Leave
        </button>

    </div>

</div>

<!-- AUDIO -->

<div id="audio"></div>

<script>

/* =========================
   WEBSOCKET
========================= */

const ws = new WebSocket(
    (location.protocol === "https:" ? "wss://" : "ws://")
    + location.host
);

let myId = null;
let username = "Anonymous";
let privateTo = null;

const users = new Map();

function send(data){

    if(ws.readyState === WebSocket.OPEN){

        ws.send(JSON.stringify(data));

    }

}

/* =========================
   CHAT
========================= */

ws.onopen = () => {

    send({
        type:"username",
        username
    });

};

ws.onclose = () => {

    console.log("Disconnected");

};

ws.onmessage = async event => {

    let data;

    try{
        data = JSON.parse(event.data);
    }catch{
        return;
    }

    if(data.type === "your-id"){

        myId = data.id;

        return;

    }

    if(data.type === "user-list"){

        users.clear();

        for(const user of data.users){

            users.set(user.id,user);

        }

        renderUsers();

        return;

    }

    if(data.type === "public"){

        addMessage(
            data.from,
            data.fromId,
            data.text,
            false,
            data.time
        );

        return;

    }

    if(data.type === "private"){

        addMessage(
            data.from,
            data.fromId,
            data.text,
            true,
            data.time
        );

        return;

    }

   /* GROUP VOICE */

if(data.type === "voice-users"){

    await handleVoiceUsers(data);

    return;

}

if(data.type === "voice-user-joined"){

    await handleVoiceUserJoined(data);

    return;

}

if(data.type === "voice-offer"){

    await receiveOffer(data);

    return;

}

if(data.type === "voice-answer"){

    await receiveAnswer(data);

    return;

}

if(data.type === "voice-ice"){

    await receiveIce(data);

    return;

}

if(data.type === "voice-user-left"){

    removeVoicePeer(data.id);

    return;

}
    if(data.type === "user-left"){

        removeVoicePeer(data.id);

        renderUsers();

        return;

    }

};

/* =========================
   USERNAME
========================= */

function setUsername(){

    const input = document.getElementById("username");

    const name = input.value.trim();

    if(!name)return;

    username = name.slice(0,30);

    send({
        type:"username",
        username
    });

    document.getElementById("login").style.display = "none";

}

document.getElementById("username").addEventListener(
    "keydown",
    e => {

        if(e.key === "Enter"){

            setUsername();

        }

    }
);

/* =========================
   USERS
========================= */

function renderUsers(){

    const container = document.getElementById("users");

    container.innerHTML = "";

    for(const user of users.values()){

        const row = document.createElement("div");

        row.className = "user";

        const avatar = document.createElement("div");

        avatar.className = "user-avatar";

        avatar.textContent =
            user.username.charAt(0).toUpperCase();

        const info = document.createElement("div");

        info.className = "user-info";

        const name = document.createElement("div");

        name.className = "user-name";

        name.textContent = user.username;

        const state = document.createElement("div");

        state.className = "user-state";

        state.textContent = "● Online";

        info.append(name,state);

        row.append(avatar,info);

        if(user.id !== myId){

            row.onclick = () => {

                privateTo = user.id;

                document.getElementById(
                    "privateName"
                ).textContent = user.username;

                document.getElementById(
                    "privateBar"
                ).style.display = "block";

                document.getElementById(
                    "message"
                ).placeholder =
                    "Private message to " +
                    user.username;

                document.getElementById(
                    "message"
                ).focus();

            };

        }

        container.appendChild(row);

    }

}

/* =========================
   CHAT SEND
========================= */

function sendMessage(){

    const input =
        document.getElementById("message");

    const text = input.value.trim();

    if(!text)return;

    if(privateTo){

        send({
            type:"private",
            to:privateTo,
            text
        });

    }else{

        send({
            type:"public",
            text
        });

    }

    input.value = "";

}

function enterSend(e){

    if(e.key === "Enter"){

        e.preventDefault();

        sendMessage();

    }

}

function makePublic(){

    privateTo = null;

    document.getElementById(
        "privateBar"
    ).style.display = "none";

    document.getElementById(
        "message"
    ).placeholder = "Message #general";

}

/* =========================
   DISPLAY MESSAGE
========================= */

function addMessage(
    from,
    fromId,
    text,
    isPrivate,
    time
){

    const welcome =
        document.getElementById("welcome");

    if(welcome)welcome.remove();

    const div =
        document.createElement("div");

    div.className =
        "msg" +
        (isPrivate ? " private" : "");

    const avatar =
        document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        from.charAt(0).toUpperCase();

    const body =
        document.createElement("div");

    body.className = "msg-body";

    const head =
        document.createElement("div");

    head.className = "msg-head";

    const name =
        document.createElement("span");

    name.className = "msg-name";

    name.textContent = from;

    const timestamp =
        document.createElement("span");

    timestamp.className = "msg-time";

    if(time){

        timestamp.textContent =
            new Date(time).toLocaleTimeString(
                [],
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

    }

    const reply =
        document.createElement("button");

    reply.className = "reply";

    reply.textContent =
        "Reply privately";

    reply.onclick = () => {

        if(!fromId)return;

        privateTo = fromId;

        document.getElementById(
            "privateName"
        ).textContent = from;

        document.getElementById(
            "privateBar"
        ).style.display = "block";

        document.getElementById(
            "message"
        ).placeholder =
            "Private message to " + from;

        document.getElementById(
            "message"
        ).focus();

    };

    head.append(
        name,
        timestamp,
        reply
    );

    const textElement =
        document.createElement("div");

    textElement.className =
        "msg-text";

    textElement.textContent =
        isPrivate ? "🔒 " + text : text;

    body.append(
        head,
        textElement
    );

    div.append(
        avatar,
        body
    );

    document.getElementById(
        "messages"
    ).appendChild(div);

    document.getElementById(
        "messages"
    ).scrollTop =
        document.getElementById(
            "messages"
        ).scrollHeight;

}

/* =========================
   GROUP VOICE
========================= */

let voiceOn = false;
let muted = false;
let stream = null;

const peers = new Map();
const iceQueue = new Map();

const rtcConfig = {
    iceServers: [
        {
            urls: "stun:stun.l.google.com:19302"
        },
        {
            urls: "stun:stun1.l.google.com:19302"
        }
    ]
};

async function getMic() {

    if (stream) return stream;

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {
        throw new Error(
            "Microphone API unavailable"
        );
    }

    stream =
        await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            },
            video: false
        });

    return stream;
}

/* =========================
   JOIN / LEAVE
========================= */

async function toggleVoice() {

    if (voiceOn) {
        leaveVoice();
        return;
    }

    try {

        await getMic();

        voiceOn = true;
        muted = false;

        document.getElementById(
            "joinVoice"
        ).textContent = "🔴 Leave Voice";

        document.getElementById(
            "voicePanel"
        ).style.display = "flex";

        document.getElementById(
            "voiceName"
        ).textContent = "🎙️ Voice Room";

        document.getElementById(
            "voiceStatus"
        ).textContent = "Joining...";

        send({
            type: "voice-join"
        });

    } catch (error) {

        console.error(
            "Microphone error:",
            error
        );

        alert(
            "Microphone access failed. Please allow microphone access."
        );
    }
}

/* =========================
   VOICE USERS
========================= */

async function handleVoiceUsers(data) {

    if (!voiceOn) return;

    /*
     * Server gives the new user everyone
     * already inside the voice room.
     *
     * Use deterministic IDs so only one side
     * creates the offer.
     */

    for (const user of data.users) {

        if (!user || user.id === myId) {
            continue;
        }

        if (myId < user.id) {
            await makeOffer(user.id);
        }
    }

    updateVoiceStatus();
}

async function handleVoiceUserJoined(data) {

    if (!voiceOn) return;

    const user = data.user;

    if (!user || user.id === myId) {
        return;
    }

    /*
     * The existing user creates the offer.
     */

    if (myId < user.id) {
        await makeOffer(user.id);
    }

    updateVoiceStatus();
}

/* =========================
   CREATE PEER
========================= */

function createPeer(id) {

    if (peers.has(id)) {
        return peers.get(id);
    }

    const peer =
        new RTCPeerConnection(
            rtcConfig
        );

    peers.set(id, peer);

    /*
     * Add our microphone.
     */

    if (stream) {

        for (
            const track of
            stream.getAudioTracks()
        ) {

            peer.addTrack(
                track,
                stream
            );
        }
    }

    /*
     * ICE candidates
     */

    peer.onicecandidate = event => {

        if (!event.candidate) {
            return;
        }

        send({
            type: "voice-ice",
            to: id,
            candidate: event.candidate
        });
    };

    /*
     * RECEIVE AUDIO
     */

    peer.ontrack = event => {

        let audio =
            document.getElementById(
                "audio-" + id
            );

        if (!audio) {

            audio =
                document.createElement(
                    "audio"
                );

            audio.id =
                "audio-" + id;

            audio.autoplay = true;
            audio.playsInline = true;
            audio.controls = false;

            document
                .getElementById("audio")
                .appendChild(audio);
        }

        if (
            event.streams &&
            event.streams[0]
        ) {

            audio.srcObject =
                event.streams[0];

            audio.play().catch(error => {
                console.warn(
                    "Audio autoplay blocked:",
                    error
                );
            });
        }

        document.getElementById(
            "voiceStatus"
        ).textContent =
            "Voice connected";
    };

    /*
     * Connection state
     */

    peer.onconnectionstatechange = () => {

        console.log(
            "Voice peer",
            id,
            peer.connectionState
        );

        if (
            peer.connectionState ===
            "connected"
        ) {

            document.getElementById(
                "voiceStatus"
            ).textContent =
                "Voice connected";
        }

        if (
            peer.connectionState ===
                "failed" ||
            peer.connectionState ===
                "closed"
        ) {

            removeVoicePeer(id);
        }
    };

    return peer;
}

/* =========================
   MAKE OFFER
========================= */

async function makeOffer(id) {

    if (!voiceOn) return;

    if (peers.has(id)) {
        return;
    }

    try {

        const peer =
            createPeer(id);

        const offer =
            await peer.createOffer();

        await peer.setLocalDescription(
            offer
        );

        send({
            type: "voice-offer",
            to: id,
            offer: peer.localDescription
        });

    } catch (error) {

        console.error(
            "Offer error:",
            error
        );

        removeVoicePeer(id);
    }
}

/* =========================
   RECEIVE OFFER
========================= */

async function receiveOffer(data) {

    if (!voiceOn) return;

    try {

        const peer =
            createPeer(data.from);

        await peer.setRemoteDescription(
            new RTCSessionDescription(
                data.offer
            )
        );

        await flushIce(
            data.from
        );

        const answer =
            await peer.createAnswer();

        await peer.setLocalDescription(
            answer
        );

        send({
            type: "voice-answer",
            to: data.from,
            answer: peer.localDescription
        });

    } catch (error) {

        console.error(
            "Offer receive error:",
            error
        );
    }
}

/* =========================
   RECEIVE ANSWER
========================= */

async function receiveAnswer(data) {

    const peer =
        peers.get(data.from);

    if (!peer) {
        console.warn(
            "No peer for answer:",
            data.from
        );
        return;
    }

    try {

        await peer.setRemoteDescription(
            new RTCSessionDescription(
                data.answer
            )
        );

        await flushIce(
            data.from
        );

    } catch (error) {

        console.error(
            "Answer error:",
            error
        );
    }
}

/* =========================
   ICE
========================= */

async function receiveIce(data) {

    let peer =
        peers.get(data.from);

    /*
     * ICE can arrive before the offer.
     * Queue it until remoteDescription exists.
     */

    if (
        !peer ||
        !peer.remoteDescription
    ) {

        if (!iceQueue.has(data.from)) {

            iceQueue.set(
                data.from,
                []
            );
        }

        iceQueue
            .get(data.from)
            .push(data.candidate);

        return;
    }

    try {

        await peer.addIceCandidate(
            new RTCIceCandidate(
                data.candidate
            )
        );

    } catch (error) {

        console.error(
            "ICE error:",
            error
        );
    }
}

/* =========================
   FLUSH ICE
========================= */

async function flushIce(id) {

    const peer =
        peers.get(id);

    const queue =
        iceQueue.get(id);

    if (!peer || !queue) {
        return;
    }

    for (
        const candidate of queue
    ) {

        try {

            await peer.addIceCandidate(
                new RTCIceCandidate(
                    candidate
                )
            );

        } catch (error) {

            console.warn(
                "Queued ICE error:",
                error
            );
        }
    }

    iceQueue.delete(id);
}

/* =========================
   MUTE
========================= */

function toggleMute() {

    if (!stream) return;

    muted = !muted;

    for (
        const track of
        stream.getAudioTracks()
    ) {

        track.enabled = !muted;
    }

    document.getElementById(
        "muteButton"
    ).textContent =
        muted
            ? "🔊 Unmute"
            : "🔇 Mute";

    document.getElementById(
        "voiceStatus"
    ).textContent =
        muted
            ? "Microphone muted"
            : "Voice connected";
}

/* =========================
   LEAVE
========================= */

function leaveVoice() {

    if (!voiceOn) return;

    send({
        type: "voice-leave"
    });

    voiceOn = false;

    for (
        const peer of
        peers.values()
    ) {

        try {
            peer.close();
        } catch {}
    }

    peers.clear();
    iceQueue.clear();

    if (stream) {

        for (
            const track of
            stream.getTracks()
        ) {

            track.stop();
        }

        stream = null;
    }

    document
        .querySelectorAll(
            "#audio audio"
        )
        .forEach(
            audio => audio.remove()
        );

    document.getElementById(
        "joinVoice"
    ).textContent =
        "🎙️ Join Voice";

    document.getElementById(
        "voicePanel"
    ).style.display =
        "none";

    document.getElementById(
        "muteButton"
    ).textContent =
        "🔇 Mute";

    muted = false;
}

/* =========================
   REMOVE PEER
========================= */

function removeVoicePeer(id) {

    const peer =
        peers.get(id);

    if (peer) {

        try {
            peer.close();
        } catch {}
    }

    peers.delete(id);
    iceQueue.delete(id);

    const audio =
        document.getElementById(
            "audio-" + id
        );

    if (audio) {
        audio.remove();
    }

    updateVoiceStatus();
}

/* =========================
   STATUS
========================= */

function updateVoiceStatus() {

    if (!voiceOn) return;

    const count =
        peers.size;

    document.getElementById(
        "voiceStatus"
    ).textContent =
        count > 0
            ? "Voice connected"
            : "Waiting for others...";
}

</script>
